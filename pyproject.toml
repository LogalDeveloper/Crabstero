[project]
name = "crabstero"
dynamic = ["version"]
description = "The simple nonversation Discord bot."
authors = [
    { name = "Logan Fick" },
]
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.7.1",
    "aiosqlite>=0.22.1",
    "aiohttp>=3.13.3",
    "prometheus-client>=0.24.1",
]

[project.scripts]
crabstero = "crabstero.__main__:main"

[project.urls]
Repository = "https://git.logal.dev/LogalDeveloper/Crabstero"

[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "codespell>=2.4.2",
    "mypy>=1.19.1",
    "pip-audit>=2.10.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.6",
]

[tool.uv]
extra-index-url = ["https://git.logal.dev/api/packages/LogalDeveloper/pypi/simple/"]
publish-url = "https://git.logal.dev/api/packages/LogalDeveloper/pypi"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["crabstero"]

[tool.hatch.build.hooks.vcs]
version-file = "crabstero/_version.py"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
explicit_package_bases = true

[tool.ruff]
target-version = "py314"
extend-exclude = ["crabstero/_version.py"]  # auto-generated by hatch-vcs

[tool.ruff.lint]
select = [
    # Core
    "F",     # Pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "N",     # pep8-naming
    "D",     # pydocstyle
    "I",     # isort
    "ICN",   # flake8-import-conventions

    # Correctness & bugs
    "B",     # flake8-bugbear
    "ASYNC", # flake8-async
    "DTZ",   # flake8-datetimez
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "A",     # flake8-builtins
    "PIE",   # flake8-pie

    # Modernization & simplification
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "FLY",   # flynt (f-string conversion)
    "PTH",   # flake8-use-pathlib

    # Performance
    "PERF",  # Perflint

    # Security
    "S",     # flake8-bandit

    # Code hygiene
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "ERA",   # eradicate
    "PGH",   # pygrep-hooks
    "TC",    # flake8-type-checking

    # Testing
    "PT",    # flake8-pytest-style

    # Ruff-specific
    "RUF",   # Ruff-specific rules
]
ignore = [
    "D203",  # incompatible with D211 (no blank line before class docstring)
    "D213",  # incompatible with D212 (summary on first line)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
"crabstero/__init__.py" = ["E402"]     # constants defined before imports intentionally
"crabstero/__main__.py" = ["T201"]     # CLI entry point uses print() for user output
"tests/**" = ["S101"]                  # assert is standard for pytest

[tool.coverage.run]
source = ["crabstero"]
omit = ["crabstero/_version.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.codespell]
skip = "uv.lock"
