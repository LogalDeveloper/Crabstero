[project]
name = "crabstero"
dynamic = ["version"]
description = "The simple nonversation Discord bot."
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [
    { name = "Logan Fick" },
]
dependencies = [
    "discord.py>=2.6.4",
    "aiosqlite>=0.22.1",
]

[project.scripts]
crabstero = "crabstero.__main__:main"

[project.urls]
Repository = "https://git.logal.dev/LogalDeveloper/Crabstero"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "mypy>=1.18.1",
    "ruff>=0.15.1",
]

[tool.uv]
extra-index-url = ["https://git.logal.dev/api/packages/LogalDeveloper/pypi/simple/"]
publish-url = "https://git.logal.dev/api/packages/LogalDeveloper/pypi"

[build-system]
requires = ["hatchling>=1.28.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["crabstero"]

[tool.hatch.build.hooks.vcs]
version-file = "crabstero/_version.py"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
extend-exclude = ["crabstero/_version.py"]

[tool.ruff.lint]
select = [
    "F",     # Pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",  # line length enforced by the formatter; residual violations are in strings/docstrings/comments
]

[tool.coverage.run]
source = ["crabstero"]
omit = [
    "crabstero/_version.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
