[project]
name = "crabstero"
dynamic = ["version"]
description = "The simple nonversation Discord bot."
authors = [
    { name = "Logan Fick" },
]
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.7.1",
    "aiosqlite>=0.22.1",
    "aiohttp>=3.13.5",
    "prometheus-client>=0.25.0",
    "uvloop>=0.22.1",
]

[project.scripts]
crabstero = "crabstero.__main__:main"

[project.urls]
Repository = "https://git.logal.dev/LogalDeveloper/Crabstero"

[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "codespell>=2.4.2",
    "mypy>=1.20.2",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.uv]
extra-index-url = ["https://git.logal.dev/api/packages/LogalDeveloper/pypi/simple/"]
publish-url = "https://git.logal.dev/api/packages/LogalDeveloper/pypi"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["crabstero"]

[tool.hatch.build.hooks.vcs]
version-file = "crabstero/_version.py"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
explicit_package_bases = true

[tool.ruff]
target-version = "py314"
extend-exclude = ["crabstero/_version.py"]  # auto-generated by hatch-vcs

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # handled by the formatter
    "D203",    # incompatible with D211 (no blank line before class docstring)
    "D213",    # incompatible with D212 (summary on first line)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is standard for pytest
    "SLF001",   # tests legitimately access private members for verification
]

[tool.coverage.run]
source = ["crabstero"]
omit = ["crabstero/_version.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.codespell]
skip = "uv.lock"
