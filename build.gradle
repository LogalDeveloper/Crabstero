plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'com.github.LogalDeveloper:Javacord:31bffc2cad'
    implementation 'redis.clients:jedis:3.6.0'

    implementation 'org.slf4j:slf4j-simple:1.7.30'
}

compileJava.options.encoding = 'UTF-8'
mainClassName = 'dev.logal.crabstero.Crabstero'
